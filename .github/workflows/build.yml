name: Windows build and release draft
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version used in package names and the tag, for example 0.1.0-beta.5
        required: true
        default: 0.1.0-beta.5
      draft:
        description: Create a prerelease draft after building and verifying both packages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the Windows app
        run: dotnet build Koma.slnx --configuration Release
      - name: Run the automated tests
        run: dotnet run --project tests/Koma.Tests/Koma.Tests.csproj --configuration Release
      - name: Set up the installer compiler
        if: github.event_name == 'workflow_dispatch'
        uses: nsis-dev/setup-nsis@v1
        with:
          version: '3.13'
      - name: Set up Python for verified engine staging
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify source and build both packages
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $sevenZip = Join-Path $env:ProgramFiles '7-Zip/7z.exe'
          ./packaging/Build-Packages.ps1 -Version $env:RELEASE_VERSION -SevenZip $sevenZip
      - name: Upload checksummed release packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: koma-win-x64
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  draft:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.draft
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: koma-win-x64
          path: dist
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --prerelease --generate-notes --title "Koma $RELEASE_VERSION"
